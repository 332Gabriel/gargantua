<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua</title>
<meta name="description" content="Simulação visual de um buraco negro com disco de acreção, inspirada em Gargantua (Interstellar). Canvas puro, sem dependências.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;
    font-family:'Courier New',ui-monospace,monospace;
  }
  canvas{display:block;position:fixed;inset:0;cursor:crosshair}
  #ui{
    position:fixed;left:24px;bottom:22px;z-index:5;
    color:#e8c9a0;pointer-events:none;
    text-shadow:0 0 12px rgba(255,157,66,.35);
  }
  #ui h1{
    font-size:13px;letter-spacing:.42em;font-weight:400;
    text-transform:uppercase;color:#ffb877;
  }
  #ui p{
    margin-top:8px;font-size:11px;letter-spacing:.05em;
    color:#8a7460;max-width:280px;line-height:1.6;
  }
  #stats{
    position:fixed;right:24px;bottom:22px;z-index:5;
    color:#5c4f42;font-size:10.5px;letter-spacing:.1em;
    text-align:right;line-height:1.9;pointer-events:none;
  }
  #stats b{color:#ffb877}
  #hint{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    color:#5c4f42;font-size:10.5px;letter-spacing:.15em;
    z-index:5;pointer-events:none;opacity:0;
    transition:opacity 1.2s ease;text-transform:uppercase;
  }
  #hint.show{opacity:1}
  @media(max-width:640px){
    #ui p{display:none}
    #stats{display:none}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hint">arraste o mouse para perturbar o disco</div>
<div id="ui">
  <h1>Gargantua</h1>
  <p>Disco de acreção simulado em canvas 2D — sem WebGL, sem dependências. O mouse empurra a matéria; o suficientemente perto, ela cai.</p>
</div>
<div id="stats">
  <div>partículas em órbita <b id="stat-ring">0</b></div>
  <div>em queda <b id="stat-fall">0</b></div>
  <div>massa acretada <b id="stat-mass">0</b></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, CX, CY;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- config ----------
  const R_HORIZON = () => Math.min(W, H) * 0.085;
  const TILT = 0.34; // achatamento vertical do disco
  const RING_COUNT = 900;
  const STAR_COUNT = 260;

  let mouse = { x: CX, y: CY, active: false, vx: 0, vy: 0, lastX: CX, lastY: CY };
  let massAccreted = 0;
  let hintShown = false;
  const hintEl = document.getElementById('hint');

  window.addEventListener('pointermove', e => {
    mouse.vx = e.clientX - mouse.lastX;
    mouse.vy = e.clientY - mouse.lastY;
    mouse.lastX = e.clientX; mouse.lastY = e.clientY;
    mouse.x = e.clientX; mouse.y = e.clientY;
    mouse.active = true;
    if (!hintShown){ hintShown = true; hintEl.classList.add('show'); setTimeout(()=>hintEl.classList.remove('show'), 4200); }
  });
  window.addEventListener('pointerdown', () => { mouse.down = true; });
  window.addEventListener('pointerup', () => { mouse.down = false; });
  window.addEventListener('pointerleave', () => { mouse.active = false; });

  // ---------- starfield ----------
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++){
    stars.push({
      x: Math.random() * 2 - 1,
      y: Math.random() * 2 - 1,
      z: 0.3 + Math.random() * 1.2,
      r: Math.random() * 1.3 + 0.2,
      tw: Math.random() * Math.PI * 2,
      tws: 0.5 + Math.random() * 1.5
    });
  }

  // ---------- disk particles ----------
  function heatColor(t){
    // t: 0 (borda externa, fria/laranja) -> 1 (borda interna, quente/branco-azulado)
    const stops = [
      [255, 90, 30],
      [255, 150, 60],
      [255, 205, 130],
      [255, 244, 214],
      [220, 235, 255]
    ];
    const f = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    const i = Math.floor(f), frac = f - i;
    const a = stops[i], b = stops[Math.min(i + 1, stops.length - 1)];
    return [
      a[0] + (b[0]-a[0])*frac,
      a[1] + (b[1]-a[1])*frac,
      a[2] + (b[2]-a[2])*frac
    ];
  }

  const ring = [];
  function seedRing(){
    ring.length = 0;
    const rh = R_HORIZON();
    for (let i = 0; i < RING_COUNT; i++){
      const rr = rh * (1.55 + Math.pow(Math.random(), 1.4) * 3.4);
      ring.push({
        a: Math.random() * Math.PI * 2,
        r: rr,
        r0: rr,
        speed: 0.55 / Math.pow(rr / rh, 1.5),
        size: 0.5 + Math.random() * 1.6,
        wob: Math.random() * Math.PI * 2,
        falling: false
      });
    }
  }
  seedRing();

  // matéria em queda (spawna nas bordas, espirala pra dentro)
  const infall = [];
  function spawnInfall(x, y){
    const dx = x - CX, dy = (y - CY) / TILT;
    const r0 = Math.hypot(dx, dy);
    const a0 = Math.atan2(dy, dx);
    infall.push({ a: a0, r: r0, speed: 0.02 + Math.random()*0.01, size: 1 + Math.random()*1.8, trail: [] });
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now - last) / 16.6667, 3);
    last = now;
    mouse.vx *= 0.9; mouse.vy *= 0.9;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2,1,4,0.34)';
    ctx.fillRect(0, 0, W, H);

    drawStars(dt);

    const rh = R_HORIZON();

    // parte de trás do disco (lensada, arco por cima do horizonte)
    drawRing(dt, rh, true);

    // sombra do horizonte de eventos
    const grad = ctx.createRadialGradient(CX, CY, rh*0.4, CX, CY, rh*1.35);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.75, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(CX, CY, rh*1.35, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(CX, CY, rh, 0, Math.PI*2); ctx.fill();

    // anel de fóton
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,225,190,0.9)';
    ctx.lineWidth = Math.max(1, rh*0.045);
    ctx.shadowColor = 'rgba(255,200,140,0.9)';
    ctx.shadowBlur = rh*0.5;
    ctx.beginPath(); ctx.arc(CX, CY, rh*1.015, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    // parte da frente do disco
    drawRing(dt, rh, false);

    drawInfall(dt, rh);

    updateStatsUI();
    requestAnimationFrame(frame);
  }

  function drawStars(dt){
    ctx.save();
    for (const s of stars){
      s.tw += 0.02 * s.tws * dt;
      const px = CX + s.x * W * 0.62 - (mouse.x - CX) * 0.01 * s.z;
      const py = CY + s.y * H * 0.62 - (mouse.y - CY) * 0.01 * s.z;
      const tw = 0.5 + Math.sin(s.tw) * 0.5;
      ctx.globalAlpha = 0.25 + tw * 0.55;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px, py, s.r * (0.6 + tw*0.4), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function screenPos(a, r, rh){
    const x = CX + Math.cos(a) * r;
    const y = CY + Math.sin(a) * r * TILT;
    return [x, y];
  }

  function drawRing(dt, rh, backHalf){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of ring){
      if (p.falling) continue;
      p.wob += 0.015 * dt;

      // atração/perturbação do mouse
      if (mouse.active){
        const [px, py] = screenPos(p.a, p.r, rh);
        const dx = px - mouse.x, dy = py - mouse.y;
        const d2 = dx*dx + dy*dy;
        const influence = 5200;
        if (d2 < influence){
          const f = (1 - d2/influence) * 0.06;
          p.r += (Math.hypot(mouse.vx, mouse.vy) > 0.5 ? -1 : 1) * f * (d2 < influence*0.3 ? 3 : 1) * 0.6;
        }
      }

      p.a += p.speed * 0.02 * dt;
      p.r += Math.sin(p.wob) * 0.03;

      // se cair perto demais do horizonte, vira matéria em queda
      if (p.r < rh * 1.08){
        p.falling = true;
        infall.push({ a: p.a, r: p.r, speed: 0.02 + Math.random()*0.015, size: p.size, trail: [] });
        continue;
      }

      const isBack = Math.sin(p.a) < 0;
      if (isBack !== backHalf) continue;

      const [x, y] = screenPos(p.a, p.r, rh);
      const t = 1 - (p.r - rh*1.5) / (rh*4.2);
      const [cr, cg, cb] = heatColor(t);
      const alpha = backHalf ? 0.55 : 0.95;

      ctx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${alpha})`;
      ctx.shadowColor = `rgba(${cr|0},${cg|0},${cb|0},0.8)`;
      ctx.shadowBlur = p.size * 2.4;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawInfall(dt, rh){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = infall.length - 1; i >= 0; i--){
      const p = infall[i];
      p.a += p.speed * 1.6 * dt;
      p.r -= (rh * 0.012 + (rh - p.r) * 0.012) * dt;
      p.trail.push(screenPos(p.a, p.r, rh));
      if (p.trail.length > 10) p.trail.shift();

      if (p.r <= rh * 0.55 || p.r <= 2){
        infall.splice(i, 1);
        massAccreted += 1;
        continue;
      }

      const t = Math.max(0, Math.min(1, 1 - p.r / (rh*3)));
      const [cr, cg, cb] = heatColor(t);
      for (let j = 0; j < p.trail.length; j++){
        const [x, y] = p.trail[j];
        const a = (j / p.trail.length) * 0.8;
        ctx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${a})`;
        ctx.shadowColor = `rgba(${cr|0},${cg|0},${cb|0},0.9)`;
        ctx.shadowBlur = p.size * 2;
        ctx.beginPath();
        ctx.arc(x, y, p.size * (0.3 + 0.7*j/p.trail.length), 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // clique/arraste solta matéria nova perto do cursor
  window.addEventListener('pointerdown', e => {
    for (let i = 0; i < 3; i++){
      spawnInfall(
        e.clientX + (Math.random()-0.5)*40,
        e.clientY + (Math.random()-0.5)*40
      );
    }
  });

  // repõe partículas do anel que caíram, de tempos em tempos
  setInterval(() => {
    const rh = R_HORIZON();
    let replenished = 0;
    for (const p of ring){
      if (p.falling && replenished < 6){
        p.falling = false;
        p.r = rh * (2.4 + Math.random() * 2.6);
        p.a = Math.random() * Math.PI * 2;
        replenished++;
      }
    }
  }, 700);

  const statRing = document.getElementById('stat-ring');
  const statFall = document.getElementById('stat-fall');
  const statMass = document.getElementById('stat-mass');
  function updateStatsUI(){
    statRing.textContent = ring.filter(p => !p.falling).length;
    statFall.textContent = infall.length;
    statMass.textContent = massAccreted;
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
